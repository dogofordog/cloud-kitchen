<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud Kitchen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="header__inner container">
        <a class="logo" href="#/about">Cloud Kitchen</a>

        <nav class="nav" id="nav" aria-label="Главное меню">
          <a class="nav__link" href="#/about">О нас</a>
          <a class="nav__link" href="#/catalog">Каталог</a>
          <a class="nav__link" href="#/cart">Корзина</a>
        </nav>

        <div class="header__actions">
          <button class="icon-btn" type="button" aria-label="Сменить тему">
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
          </button>
          <a class="icon-btn cart-btn" href="#/cart" aria-label="Корзина">
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 4h2l2.4 11h10.2l2-8H6.2" />
              <circle cx="9" cy="20" r="1.2" />
              <circle cx="17" cy="20" r="1.2" />
            </svg>
            <span class="badge" hidden>0</span>
          </a>
          <button
            class="icon-btn icon-btn--accent burger"
            type="button"
            aria-label="Открыть меню"
            aria-expanded="false"
            aria-controls="nav"
          >
            <svg
              class="burger__icon burger__icon--open"
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
            <svg
              class="burger__icon burger__icon--close"
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main id="app" class="main container"></main>

    <footer class="footer">
      <div class="container">
        <p class="footer__title">Cloud Kitchen</p>
        <p class="footer__text">Командный проект RS School, 2026</p>
      </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
